# CI for the healthcare GenAI platform.
# Stored under ci/ (not .github/workflows/) so it can be committed without a
# workflow-scoped token; copy to .github/workflows/ci.yml to activate.
name: ci
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run graded evaluation
        run: PYTHONPATH=src python -m clinical_ai.run_platform
      - name: Run tests
        run: PYTHONPATH=src python -m pytest tests/ -q
